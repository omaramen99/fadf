<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icoon.ico">
<title>Omar Amen · Variant 3 · Blueprint Crow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  :root {
    --ink: #111; --paper: #fdfdfb; --muted: #737373; --line: #d6d6d2; --grid: rgba(17, 17, 17, .055); --grid2: rgba(17, 17, 17, .09);
    --font-display: 'Space Grotesk', system-ui, sans-serif; --font-body: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
    --radius: 0px; --pad: clamp(16px, 4vw, 48px);
  }
  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid2) 1px, transparent 1px), linear-gradient(90deg, var(--grid2) 1px, transparent 1px),
      linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  }
  .mono-t { font-family: var(--mono); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 var(--pad); }
  .frame { border: 1.5px solid var(--ink); background: var(--paper); position: relative; }

  /* nav */
  .nav { position: sticky; top: 0; z-index: 50; background: var(--paper); border-bottom: 1.5px solid var(--ink); }
  .nav .wrap { display: flex; align-items: center; height: 56px; gap: 20px; font-family: var(--mono); font-size: 13px; }
  .nav .id { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .nav .id b { border: 1.5px solid var(--ink); padding: 2px 6px; font-weight: 500; }
  .nav ul { display: flex; list-style: none; margin: 0 0 0 auto; padding: 0; }
  .nav ul a { display: block; padding: 18px 14px; text-decoration: none; border-left: 1px solid var(--line); }
  .nav ul a:hover { background: var(--ink); color: var(--paper); }
  .nav .coords { color: var(--muted); min-width: 150px; text-align: right; }
  @media (max-width: 900px) { .nav ul, .nav .coords { display: none; } }

  /* hero sheet */
  .hero { padding: clamp(24px, 4vw, 48px) 0; }
  .sheet { display: grid; grid-template-columns: 1fr 1.05fr; min-height: 560px; }
  .sheet > div { padding: clamp(22px, 3.5vw, 44px); }
  .sheet-left { border-right: 1.5px solid var(--ink); display: flex; flex-direction: column; }
  .tag { display: inline-block; font-family: var(--mono); font-size: 12px; border: 1px solid var(--ink); padding: 3px 8px; letter-spacing: .04em; }
  .hero h1 { font-weight: 700; font-size: clamp(58px, 8.4vw, 124px); line-height: .88; letter-spacing: -.055em; margin: 26px 0 22px; }
  .hero h1 span { display: block; -webkit-text-stroke: 1.5px var(--ink); color: transparent; }
  .typer { font-family: var(--mono); font-size: clamp(15px, 1.5vw, 19px); min-height: 1.6em; }
  .typer::before { content: '> '; color: var(--muted); }
  .typer i { display: inline-block; width: .6em; height: 1.1em; background: var(--ink); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .hero .lead { max-width: 480px; margin: 22px 0 0; color: #333; }
  .hero .actions { margin-top: auto; padding-top: 30px; display: flex; gap: 0; flex-wrap: wrap; }
  .b { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; padding: 13px 18px; border: 1.5px solid var(--ink); text-decoration: none; background: var(--paper); transition: .2s; }
  .b + .b { border-left: 0; }
  .b.solid, .b:hover { background: var(--ink); color: var(--paper); }
  .sheet-right { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .draw { width: 100%; max-width: 560px; position: relative; }
  .draw svg { width: 100%; height: auto; overflow: visible; }
  .draw .wire-edges polygon, .draw .wire-outline, .draw .wire-legs path { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawin 2.6s ease forwards; }
  .draw .wire-outline { animation-duration: 3.2s; }
  .draw .wire-nodes circle { opacity: 0; animation: pop .4s ease forwards; animation-delay: 2.2s; }
  @keyframes drawin { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; } }
  .dim { position: absolute; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .dim-h { left: 7%; right: 2%; top: 4%; border-top: 1px solid var(--muted); text-align: center; padding-top: 4px; }
  .dim-h::before, .dim-h::after { content: ''; position: absolute; top: -6px; width: 1px; height: 11px; background: var(--muted); }
  .dim-h::before { left: 0; } .dim-h::after { right: 0; }
  .dim-v { top: 16%; bottom: 14%; right: 0; border-left: 1px solid var(--muted); writing-mode: vertical-rl; padding-left: 4px; display: flex; align-items: center; justify-content: center; }
  .callout { position: absolute; font-family: var(--mono); font-size: 11px; display: flex; align-items: center; gap: 6px; }
  .callout::before { content: ''; width: 46px; height: 1px; background: var(--ink); }
  .c1 { left: 0; top: 17%; } .c1::before { order: 2; transform: rotate(28deg); transform-origin: left; }
  .c2 { right: 6%; top: 70%; } .c2::before { display: none; }
  @media (max-width: 600px) { .callout, .dim-v { display: none; } }
  .titleblock { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1.5px solid var(--ink); font-family: var(--mono); font-size: 12px; }
  .titleblock div { padding: 10px 14px; border-right: 1px solid var(--ink); }
  .titleblock div:last-child { border-right: 0; }
  .titleblock small { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
  @media (max-width: 900px) {
    .sheet { grid-template-columns: 1fr; }
    .sheet-left { border-right: 0; border-bottom: 1.5px solid var(--ink); }
    .titleblock { grid-template-columns: 1fr 1fr; }
    .titleblock div { border-bottom: 1px solid var(--ink); }
  }

  /* section scaffolding */
  section[data-sec]:not(.hero) { padding: clamp(40px, 6vw, 72px) 0; }
  .sh { display: flex; align-items: stretch; border: 1.5px solid var(--ink); border-bottom: 0; background: var(--paper); }
  .sh .no { font-family: var(--mono); padding: 14px 18px; border-right: 1.5px solid var(--ink); background: var(--ink); color: var(--paper); font-size: 14px; display: flex; align-items: center; }
  .sh h2 { margin: 0; padding: 12px 20px; font-size: clamp(24px, 3vw, 36px); letter-spacing: -.03em; font-weight: 600; flex: 1; }
  .sh .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 0 18px; display: flex; align-items: center; border-left: 1px solid var(--line); }
  @media (max-width: 600px) { .sh .meta { display: none; } }

  /* about */
  .about { display: grid; grid-template-columns: 300px 1fr 330px; }
  .about > div { padding: 28px; }
  .about > div + div { border-left: 1.5px solid var(--ink); }
  .photo { position: relative; padding: 14px; }
  .photo img { width: 100%; aspect-ratio: 1; object-fit: cover; }
  .photo::before, .photo::after { content: ''; position: absolute; width: 18px; height: 18px; border: 1.5px solid var(--ink); }
  .photo::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .photo::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .photo figcaption { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }
  .about p.profile { font-size: clamp(19px, 1.8vw, 24px); line-height: 1.45; margin: 0; letter-spacing: -.01em; }
  .kv { font-family: var(--mono); font-size: 13px; margin: 0; }
  .kv div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
  @media (max-width: 1000px) { .about { grid-template-columns: 1fr 1fr; } .about > div:nth-child(2) { grid-column: 1 / -1; order: -1; border-left: 0; border-bottom: 1.5px solid var(--ink); } .about > div:first-child { border-left: 0; } }
  @media (max-width: 640px) { .about { grid-template-columns: 1fr; } .about > div + div { border-left: 0; border-top: 1.5px solid var(--ink); } .about > div:nth-child(2) { border-top: 0; } }

  /* skills: bill of materials */
  table { width: 100%; border-collapse: collapse; background: var(--paper); }
  .bom th, .bom td { border: 1.5px solid var(--ink); padding: 14px 16px; text-align: left; vertical-align: top; }
  .bom th { font-family: var(--mono); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; background: #f1f1ee; }
  .bom td:first-child { font-family: var(--mono); width: 80px; }
  .bom td:nth-child(2) { font-weight: 600; width: 220px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span { font-family: var(--mono); font-size: 12.5px; border: 1px solid var(--ink); padding: 3px 8px; transition: .15s; }
  .chips span:hover { background: var(--ink); color: var(--paper); }
  .bom tr:hover td { background: #f6f6f3; }
  .segs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--ink); border-top: 0; background: var(--paper); }
  .seg { padding: 18px 16px; }
  .seg + .seg { border-left: 1.5px solid var(--ink); }
  .seg .top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 13px; margin-bottom: 10px; }
  .seg .bar { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
  .seg .bar i { height: 14px; border: 1px solid var(--ink); background: transparent; transition: background .2s; }
  .segs.in .bar i.on { background: var(--ink); }
  @media (max-width: 800px) {
    .segs { grid-template-columns: 1fr 1fr; } .seg:nth-child(3) { border-left: 0; } .seg:nth-child(n+3) { border-top: 1.5px solid var(--ink); }
    .bom thead { display: none; } .bom tr { display: grid; grid-template-columns: 60px 1fr; } .bom td { border-bottom: 0; }
    .bom td:nth-child(3) { grid-column: 1 / -1; border-top: 0; } .bom td:nth-child(2) { width: auto; } .bom tr:last-child td:last-child { border-bottom: 1.5px solid var(--ink); }
  }

  /* work: spec sheets */
  .specs { display: grid; grid-template-columns: repeat(3, 1fr); border-left: 1.5px solid var(--ink); border-top: 1.5px solid var(--ink); }
  .spec { display: flex; flex-direction: column; border-right: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); text-decoration: none; background: var(--paper); transition: background .25s; }
  .spec-h { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; padding: 9px 14px; border-bottom: 1px solid var(--ink); }
  .spec-img { position: relative; margin: 14px; aspect-ratio: 16 / 10; overflow: hidden; border: 1px solid var(--ink); }
  .spec-img img { width: 100%; height: 100%; object-fit: cover; }
  .spec-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(var(--ink), var(--ink)) center / 1px 100% no-repeat, linear-gradient(var(--ink), var(--ink)) center / 100% 1px no-repeat; opacity: 0; transition: opacity .3s; mix-blend-mode: difference; }
  .spec:hover .spec-img::after { opacity: .5; }
  .spec h3 { font-size: 22px; letter-spacing: -.02em; margin: 0 14px 6px; line-height: 1.15; }
  .spec p { margin: 0 14px 14px; font-size: 14px; color: #444; }
  .spec .chips { margin: auto 14px 0; padding-bottom: 14px; }
  .spec-f { font-family: var(--mono); font-size: 12px; padding: 10px 14px; border-top: 1px solid var(--ink); display: flex; justify-content: space-between; }
  .spec:hover { background: #f3f3f0; }
  .spec:hover .spec-f { background: var(--ink); color: var(--paper); }
  @media (max-width: 1000px) { .specs { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 620px) { .specs { grid-template-columns: 1fr; } }

  /* experience: revision history */
  .rev td, .rev th { border: 1.5px solid var(--ink); padding: 16px; text-align: left; vertical-align: top; }
  .rev th { font-family: var(--mono); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; background: #f1f1ee; }
  .rev td:first-child { font-family: var(--mono); width: 70px; }
  .rev td:nth-child(2) { font-family: var(--mono); font-size: 13px; width: 170px; }
  .rev td:nth-child(3) { width: 290px; }
  .rev h3 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.01em; }
  .rev .org { font-weight: 600; margin: 0; font-size: 15px; }
  .rev .where { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  .rev ul { margin: 0; padding-left: 0; list-style: none; }
  .rev li { padding-left: 18px; position: relative; margin-bottom: 6px; }
  .rev li::before { content: '+'; position: absolute; left: 0; font-family: var(--mono); }
  @media (max-width: 860px) {
    .rev thead { display: none; } .rev tr { display: grid; grid-template-columns: 60px 1fr; }
    .rev td { border-bottom: 0; } .rev td:nth-child(n+3) { grid-column: 1 / -1; border-top: 0; } .rev td:nth-child(2), .rev td:nth-child(3) { width: auto; }
    .rev tr:last-child td:last-child { border-bottom: 1.5px solid var(--ink); }
  }

  /* education */
  .certs { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--ink); background: var(--paper); }
  .cert { padding: 22px; position: relative; }
  .cert + .cert { border-left: 1.5px solid var(--ink); }
  .cert .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .cert h3 { font-size: 20px; letter-spacing: -.02em; line-height: 1.15; margin: 10px 0 6px; }
  .cert p { margin: 0; font-size: 14px; }
  .stamp { display: inline-block; margin-top: 14px; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border: 1.5px solid var(--ink); padding: 4px 8px; transform: rotate(-3deg); }
  @media (max-width: 900px) { .certs { grid-template-columns: 1fr 1fr; } .cert:nth-child(3) { border-left: 0; } .cert:nth-child(n+3) { border-top: 1.5px solid var(--ink); } }
  @media (max-width: 560px) { .certs { grid-template-columns: 1fr; } .cert + .cert { border-left: 0; border-top: 1.5px solid var(--ink); } }

  /* contact: terminal */
  .contact { display: grid; grid-template-columns: 1fr 1.2fr; }
  .contact > div { padding: 30px; }
  .contact > div + div { border-left: 1.5px solid var(--ink); }
  .contact .big { font-size: clamp(34px, 4.4vw, 60px); font-weight: 700; letter-spacing: -.045em; line-height: .95; margin: 0 0 22px; }
  .contact .big span { -webkit-text-stroke: 1.2px var(--ink); color: transparent; }
  .links { list-style: none; padding: 0; margin: 20px 0 0; font-family: var(--mono); font-size: 14px; border-top: 1px solid var(--ink); }
  .links a { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px dashed var(--line); text-decoration: none; }
  .links a:hover { background: var(--ink); color: var(--paper); padding: 11px 8px; }
  .term { font-family: var(--mono); font-size: 14px; }
  .term .cmd { margin: 0 0 18px; }
  .term .cmd b { font-weight: 500; }
  .term label { display: block; margin-top: 14px; color: var(--muted); font-size: 12px; }
  .term input, .term textarea { width: 100%; font: inherit; color: inherit; border: 1.5px solid var(--ink); background: var(--paper); padding: 11px 12px; margin-top: 4px; border-radius: 0; }
  .term input:focus, .term textarea:focus { outline: none; box-shadow: 4px 4px 0 var(--ink); }
  .term textarea { min-height: 120px; resize: vertical; }
  .term .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .term button { margin-top: 18px; font: inherit; cursor: pointer; }
  .form-note { color: var(--muted); font-size: 12px; margin: 10px 0 0; min-height: 1em; }
  @media (max-width: 860px) { .contact { grid-template-columns: 1fr; } .contact > div + div { border-left: 0; border-top: 1.5px solid var(--ink); } .term .row { grid-template-columns: 1fr; } }

  footer { padding: 0 0 100px; }
  footer .titleblock { border: 1.5px solid var(--ink); background: var(--paper); }
</style>
</head>
<body data-variant="3">
<div id="app"></div>
<script src="assets/content.js"></script>
<script src="assets/crows.js"></script>
<script src="assets/shared.js"></script>
<script>
(function () {
  var S = SITE, e = UI.esc;
  var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var first = S.name.split(' ')[0], last = S.name.split(' ')[1];
  var year = new Date().getFullYear();
  var titleblock = function (sheet) {
    return '<div class="titleblock">' +
      '<div><small>Project</small>' + e(S.site) + '</div><div><small>Drawn by</small>' + e(S.name) + '</div>' +
      '<div><small>Discipline</small>AEC · MEP</div><div><small>Date</small>' + year + '</div><div><small>Sheet</small>' + sheet + '</div></div>';
  };

  var html = '' +
  '<header class="nav"><div class="wrap">' +
    '<a class="id" href="#top"><b>OA</b>omar_amen / aec-software-dev</a>' +
    '<ul><li><a href="#about">01_about</a></li><li><a href="#skills">02_skills</a></li><li><a href="#work">03_work</a></li><li><a href="#experience">04_history</a></li><li><a href="#education">05_edu</a></li><li><a href="#contact">06_contact</a></li></ul>' +
    '<span class="coords" id="coords">x: 0000  y: 0000</span>' +
  '</div></header>' +

  '<section class="hero" id="top" data-sec><div class="wrap"><div class="frame">' +
    '<div class="sheet">' +
      '<div class="sheet-left">' +
        '<span class="tag">SHEET A-001 · PORTFOLIO</span>' +
        '<h1>' + e(first) + '<span>' + e(last) + '</span></h1>' +
        '<div class="typer" id="typer"></div>' +
        '<p class="lead">' + e(S.role) + ' building ' + e(S.tagline) + '. Mechanical engineer turned developer, based in ' + e(S.location) + ', working with teams in the US and Europe.</p>' +
        '<div class="actions"><a class="b solid" href="#work">view_projects →</a><a class="b" href="#contact">contact()</a><a class="b" href="' + e(S.resume) + '">résumé.pdf ↓</a></div>' +
      '</div>' +
      '<div class="sheet-right"><div class="draw">' +
        '<span class="dim dim-h">Corvus cornix · wireframe · scale 1:1</span>' +
        '<span class="dim dim-v">h = 1.00 crow</span>' +
        '<span class="callout c1">beak: sharp</span><span class="callout c2">wing: parametric</span>' +
        CROW.perchedWire() +
      '</div></div>' +
    '</div>' + titleblock('A-001') +
  '</div></div></section>' +

  '<section id="about" data-sec><div class="wrap">' +
    '<div class="sh"><span class="no">01</span><h2>About</h2><span class="meta">profile.md</span></div>' +
    '<div class="frame about">' +
      '<div><figure class="photo" style="margin:0"><img class="mono" src="' + e(S.portrait) + '" alt="Omar Amen"><figcaption>fig. 01 — the developer</figcaption></figure></div>' +
      '<div class="rv"><p class="profile">' + e(S.profile) + '</p></div>' +
      '<div class="rv"><dl class="kv">' +
        '<div><dt>role</dt><dd>' + e(S.role) + '</dd></div>' +
        '<div><dt>focus</dt><dd>MEP &amp; fabrication · Revit</dd></div>' +
        '<div><dt>experience</dt><dd>5+ years</dd></div>' +
        '<div><dt>revit</dt><dd>2019 – 2027</dd></div>' +
        '<div><dt>based_in</dt><dd>' + e(S.location) + '</dd></div>' +
        '<div><dt>works_with</dt><dd>US · Europe (remote)</dd></div>' +
        '<div><dt>education</dt><dd>B.Sc. Mech. Power Eng.</dd></div>' +
      '</dl></div>' +
    '</div>' +
  '</div></section>' +

  '<section id="skills" data-sec><div class="wrap">' +
    '<div class="sh"><span class="no">02</span><h2>Skills — bill of materials</h2><span class="meta">' + S.skillGroups.length + ' groups</span></div>' +
    '<table class="bom"><thead><tr><th>Item</th><th>Group</th><th>Components</th></tr></thead><tbody>' +
      S.skillGroups.map(function (g, i) {
        return '<tr><td>S-' + pad2(i + 1) + '</td><td>' + e(g.name) + '</td><td><div class="chips">' + g.items.map(function (x) { return '<span>' + e(x) + '</span>'; }).join('') + '</div></td></tr>';
      }).join('') +
    '</tbody></table>' +
    '<div class="segs rv">' + S.levels.map(function (l) {
      var on = Math.round(l.value / 5), bars = '';
      for (var i = 0; i < 20; i++) bars += '<i class="' + (i < on ? 'on' : '') + '" style="transition-delay:' + (i * 45) + 'ms"></i>';
      return '<div class="seg"><div class="top"><span>' + e(l.name) + '</span><span>' + l.value + '%</span></div><div class="bar">' + bars + '</div></div>';
    }).join('') + '</div>' +
  '</div></section>' +

  '<section id="work" data-sec><div class="wrap">' +
    '<div class="sh"><span class="no">03</span><h2>Projects — spec sheets</h2><span class="meta">' + S.projects.length + ' sheets · click to open</span></div>' +
    '<div class="specs">' + S.projects.map(function (p, i) {
      return '<a href="#" class="spec mono-host rv" data-project="' + e(p.id) + '">' +
        '<div class="spec-h"><span>PRJ-' + pad2(i + 1) + '</span><span>' + (S.featured.indexOf(p.id) > -1 ? '★ featured' : 'rev. 1') + '</span></div>' +
        '<div class="spec-img"><img class="mono" src="' + e(p.images[0]) + '" alt="" loading="lazy"></div>' +
        '<h3>' + e(p.name) + '</h3><p>' + e(p.short) + '</p>' +
        '<div class="chips">' + p.tools.slice(0, 4).map(function (t) { return '<span>' + e(t) + '</span>'; }).join('') + '</div>' +
        '<div class="spec-f"><span>' + p.images.length + ' figs · ' + p.features.length + ' features</span><span>open_sheet →</span></div></a>';
    }).join('') + '</div>' +
  '</div></section>' +

  '<section id="experience" data-sec><div class="wrap">' +
    '<div class="sh"><span class="no">04</span><h2>Experience — revision history</h2><span class="meta">latest first</span></div>' +
    '<table class="rev"><thead><tr><th>Rev</th><th>Date</th><th>Role</th><th>Changes</th></tr></thead><tbody>' +
      S.experience.map(function (x, i) {
        return '<tr><td>R' + (S.experience.length - i) + '</td><td>' + e(x.when) + '</td>' +
          '<td><h3>' + e(x.role) + '</h3><p class="org">' + e(x.org) + '</p><p class="where">' + e(x.where) + '</p></td>' +
          '<td><ul>' + x.points.map(function (p) { return '<li>' + e(p) + '</li>'; }).join('') + '</ul></td></tr>';
      }).join('') +
    '</tbody></table>' +
  '</div></section>' +

  '<section id="education" data-sec><div class="wrap">' +
    '<div class="sh"><span class="no">05</span><h2>Education &amp; training</h2><span class="meta">certified</span></div>' +
    '<div class="certs">' + S.education.map(function (x) {
      return '<div class="cert rv"><span class="when">' + e(x.when) + '</span><h3>' + e(x.title) + '</h3><p>' + e(x.org) + '</p>' + (x.note ? '<span class="stamp">' + e(x.note) + '</span>' : '') + '</div>';
    }).join('') + '</div>' +
  '</div></section>' +

  '<section id="contact" data-sec><div class="wrap">' +
    '<div class="sh"><span class="no">06</span><h2>Contact</h2><span class="meta">open for projects</span></div>' +
    '<div class="frame contact">' +
      '<div><p class="big">Let’s draft<br><span>your next tool.</span></p>' +
        '<ul class="links">' +
          '<li><a href="mailto:' + e(S.email) + '"><span>email</span><span>' + e(S.email) + '</span></a></li>' +
          '<li><a href="' + e(S.phoneHref) + '"><span>phone</span><span>' + e(S.phone) + '</span></a></li>' +
          S.social.map(function (s) { return '<li><a href="' + e(s.url) + '" target="_blank" rel="noopener"><span>' + e(s.name.toLowerCase()) + '</span><span>↗</span></a></li>'; }).join('') +
        '</ul></div>' +
      '<form class="term" data-demo><p class="cmd">$ <b>send_message</b> --to ' + e(S.email) + '</p>' +
        '<div class="row"><label>--name<input required></label><label>--email<input type="email" required></label></div>' +
        '<label>--subject<input required></label><label>--message<textarea required></textarea></label>' +
        '<button class="b solid" type="submit">run ↵</button><p class="form-note"></p></form>' +
    '</div>' +
  '</div></section>' +

  '<footer><div class="wrap">' + titleblock('A-999 · end') + '</div></footer>';

  document.getElementById('app').innerHTML = html;

  // typing effect cycling through the titles
  var typer = document.getElementById('typer'), ti = 0, ci = 0, del = false;
  (function type() {
    var t = S.titles[ti];
    ci += del ? -1 : 1;
    typer.innerHTML = e(t.slice(0, ci)) + '<i></i>';
    var wait = del ? 28 : 70;
    if (!del && ci === t.length) { del = true; wait = 1600; }
    else if (del && ci === 0) { del = false; ti = (ti + 1) % S.titles.length; wait = 350; }
    setTimeout(type, wait);
  })();

  // CAD-style cursor coordinates in the nav
  var coords = document.getElementById('coords');
  addEventListener('mousemove', function (ev) {
    var x = String(Math.round(ev.pageX)).padStart(4, '0'), y = String(Math.round(ev.pageY)).padStart(4, '0');
    coords.textContent = 'x: ' + x + '  y: ' + y;
  }, { passive: true });

  UI.init();
})();
</script>
</body>
</html>
