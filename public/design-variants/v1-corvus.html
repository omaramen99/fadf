<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icoon.ico">
<title>Omar Amen · Variant 1 · Corvus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/shared.css">
<style>
  :root {
    --ink: #0b0b0b; --paper: #f7f6f2; --muted: #6d6a64; --line: #0b0b0b;
    --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', system-ui, sans-serif;
    --pad: clamp(16px, 4vw, 56px);
  }
  body { font-size: 16px; }
  .wrap { padding: 0 var(--pad); max-width: 1440px; margin: 0 auto; }

  /* nav */
  .nav { position: sticky; top: 0; z-index: 50; background: rgba(247, 246, 242, .9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ink); }
  .nav .wrap { display: flex; align-items: center; gap: 24px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -.01em; }
  .brand svg { width: 42px; height: 32px; }
  .nav ul { display: flex; gap: 26px; list-style: none; margin: 0 0 0 auto; padding: 0; font-size: 14px; }
  .nav ul a { text-decoration: none; position: relative; }
  .nav ul a::after { content: ''; position: absolute; left: 0; right: 100%; bottom: -3px; height: 1px; background: currentColor; transition: right .3s; }
  .nav ul a:hover::after { right: 0; }
  .nav .cv { border: 1px solid var(--ink); padding: 7px 14px; font-size: 13px; text-decoration: none; border-radius: 999px; transition: .2s; }
  .nav .cv:hover { background: var(--ink); color: var(--paper); }
  @media (max-width: 760px) { .nav ul { display: none; } .nav .cv { margin-left: auto; } }

  /* hero */
  .hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--ink); }
  .masthead { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 14px 0; border-bottom: 1px solid var(--ink); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .hero-grid { display: grid; grid-template-columns: 1.35fr .9fr; gap: clamp(20px, 4vw, 60px); padding: clamp(28px, 5vw, 64px) 0 clamp(36px, 6vw, 80px); align-items: end; position: relative; z-index: 1; }
  .hero h1 { font-family: var(--font-display); font-weight: 350; font-size: clamp(68px, 13vw, 210px); line-height: .84; letter-spacing: -.045em; margin: 0; }
  .hero h1 em { font-style: italic; font-weight: 300; }
  .hero h1 .dot { display: inline-block; width: .16em; height: .16em; background: var(--ink); border-radius: 50%; margin-left: .04em; }
  .hero .role { margin: 28px 0 0; max-width: 540px; font-size: clamp(17px, 1.6vw, 21px); line-height: 1.5; }
  .hero .role strong { font-weight: 600; }
  .hero .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border: 1px solid var(--ink); text-decoration: none; font-size: 14px; font-weight: 500; transition: .25s; }
  .btn-solid { background: var(--ink); color: var(--paper); }
  .btn:hover { transform: translateY(-2px); box-shadow: 4px 4px 0 var(--ink); }
  .hero-crow { position: absolute; right: -6%; top: 34px; width: min(62vw, 880px); opacity: .06; pointer-events: none; }

  /* SAMPLE photo frame */
  .sample { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: #e7e5df; border: 1px solid var(--ink); }
  .sample img { width: 100%; height: 100%; object-fit: cover; }
  .sample figcaption { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 12px; background: rgba(247, 246, 242, .92); border: 1px dashed var(--ink); font-size: 12px; line-height: 1.45; }
  .sample figcaption b { display: block; letter-spacing: .14em; font-size: 11px; margin-bottom: 3px; }

  /* ticker */
  .ticker { background: var(--ink); color: var(--paper); overflow: hidden; white-space: nowrap; border-bottom: 1px solid var(--ink); }
  .ticker-track { display: inline-block; padding: 16px 0; animation: tick 40s linear infinite; font-family: var(--font-display); font-style: italic; font-size: clamp(20px, 2.4vw, 30px); }
  .ticker-track span { margin: 0 28px; }
  .ticker-track i { font-style: normal; opacity: .5; }
  @keyframes tick { to { transform: translateX(-50%); } }

  /* sections */
  section[data-sec] { border-bottom: 1px solid var(--ink); padding: clamp(56px, 8vw, 110px) 0; }
  .sec-head { display: grid; grid-template-columns: 110px 1fr auto; align-items: baseline; gap: 16px; margin-bottom: clamp(32px, 5vw, 60px); }
  .sec-no { font-family: var(--font-display); font-style: italic; font-size: 22px; }
  .sec-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 6vw, 84px); line-height: .95; letter-spacing: -.03em; margin: 0; }
  .sec-aside { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 700px) { .sec-head { grid-template-columns: 1fr; gap: 6px; } .sec-aside { display: none; } }

  /* about */
  .about-grid { display: grid; grid-template-columns: 110px 1fr 320px; gap: 16px 40px; }
  .lede { grid-column: 2; font-family: var(--font-display); font-weight: 350; font-size: clamp(24px, 2.8vw, 38px); line-height: 1.22; letter-spacing: -.015em; margin: 0; }
  .lede::first-letter { float: left; font-size: 3.3em; line-height: .8; padding: 6px 12px 0 0; font-weight: 500; }
  .about-photo { grid-column: 3; grid-row: 1 / span 2; }
  .about-photo img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid var(--ink); }
  .about-photo p { font-size: 12px; color: var(--muted); margin: 8px 0 0; font-style: italic; }
  .stats { grid-column: 2; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); margin-top: 24px; }
  .stat { padding: 20px 16px 0 0; }
  .stat + .stat { border-left: 1px solid var(--ink); padding-left: 16px; }
  .stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 2.8vw, 42px); line-height: 1; white-space: nowrap; }
  .stat span { font-size: 13px; color: var(--muted); }
  @media (max-width: 900px) {
    .about-grid { grid-template-columns: 1fr; }
    .lede, .stats, .about-photo { grid-column: 1; grid-row: auto; }
    .about-photo { max-width: 320px; }
  }
  @media (max-width: 520px) { .stats { grid-template-columns: 1fr; } .stat + .stat { border-left: 0; border-top: 1px solid var(--line); padding-left: 0; } .stat { padding-bottom: 14px; } }

  /* skills */
  .skills { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
  .skill { padding: 26px 24px 28px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); transition: background .3s, color .3s; }
  .skill:hover { background: var(--ink); color: var(--paper); }
  .skill h3 { font-family: var(--font-display); font-weight: 500; font-size: 24px; margin: 0 0 12px; display: flex; justify-content: space-between; }
  .skill h3 small { font-family: var(--font-body); font-size: 12px; font-weight: 400; opacity: .55; }
  .skill ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 15px; }
  .skill li::before { content: '— '; opacity: .4; }
  .levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 44px; }
  .level b { font-family: var(--font-display); font-weight: 400; font-size: 40px; line-height: 1; }
  .level span { display: block; font-size: 14px; margin: 4px 0 10px; }
  .level i { display: block; height: 2px; background: #cfcdc6; position: relative; }
  .level i::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 0; background: var(--ink); transition: width 1.6s cubic-bezier(.2, .7, .2, 1) .2s; }
  .levels.in .level i::after { width: var(--v); }
  @media (max-width: 900px) { .skills { grid-template-columns: 1fr 1fr; } .levels { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px) { .skills { grid-template-columns: 1fr; } }

  /* work index */
  .work { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  .work li { border-bottom: 1px solid var(--ink); }
  .work a { display: grid; grid-template-columns: 110px 1.1fr 1.3fr 170px; gap: 20px; align-items: center; padding: 24px 0; text-decoration: none; transition: padding .35s, background .35s, color .35s; }
  .work a:hover { background: var(--ink); color: var(--paper); padding-left: 18px; padding-right: 18px; }
  .work .no { font-family: var(--font-display); font-style: italic; font-size: 20px; }
  .work .nm { font-family: var(--font-display); font-size: clamp(22px, 2.6vw, 34px); line-height: 1.05; letter-spacing: -.02em; }
  .work .ds { font-size: 15px; color: var(--muted); }
  .work a:hover .ds { color: #bdbab3; }
  .work .tl { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; text-align: right; }
  .work .star { display: inline-block; font-size: 11px; letter-spacing: .12em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; margin-left: 8px; vertical-align: middle; font-family: var(--font-body); font-style: normal; }
  .peek { position: fixed; z-index: 40; width: 360px; aspect-ratio: 16 / 10; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.9) rotate(-2deg); transition: opacity .25s, transform .25s; border: 1px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); object-fit: cover; background: #ddd; }
  .peek.on { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
  .work .thumb { display: none; }
  @media (max-width: 900px) {
    .work a { grid-template-columns: 56px 1fr; }
    .work .ds, .work .tl { grid-column: 2; text-align: left; }
    .work .thumb { display: block; grid-column: 2; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border: 1px solid var(--ink); }
    .peek { display: none; }
  }

  /* experience */
  .xp { border-top: 1px solid var(--ink); }
  .xp-row { display: grid; grid-template-columns: 110px 1fr 1.4fr; gap: 20px 40px; padding: 30px 0; border-bottom: 1px solid var(--line); }
  .xp-row:last-child { border-bottom: 0; }
  .xp-when { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .xp-role { font-family: var(--font-display); font-size: 26px; line-height: 1.1; margin: 0 0 6px; font-weight: 450; }
  .xp-org { font-weight: 600; margin: 0; }
  .xp-where { font-size: 14px; color: var(--muted); margin: 2px 0 0; }
  .xp ul { margin: 0; padding-left: 18px; }
  .xp li { margin-bottom: 6px; }
  .xp li::marker { content: '✦  '; font-size: 10px; }
  @media (max-width: 900px) { .xp-row { grid-template-columns: 1fr; gap: 10px; } }

  /* education */
  .edu { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); }
  .edu div { padding: 24px 22px 8px 0; }
  .edu div + div { border-left: 1px solid var(--ink); padding-left: 22px; }
  .edu .when { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .edu h3 { font-family: var(--font-display); font-weight: 450; font-size: 22px; line-height: 1.15; margin: 10px 0 8px; }
  .edu p { margin: 0; font-size: 14px; }
  .edu .award { display: inline-block; margin-top: 10px; font-size: 12px; background: var(--ink); color: var(--paper); padding: 3px 10px; }
  @media (max-width: 900px) { .edu { grid-template-columns: 1fr 1fr; } .edu div:nth-child(3) { border-left: 0; padding-left: 0; } }
  @media (max-width: 560px) { .edu { grid-template-columns: 1fr; } .edu div + div { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); } }

  /* contact */
  .contact-big { font-family: var(--font-display); font-weight: 350; font-size: clamp(46px, 9vw, 150px); line-height: .9; letter-spacing: -.045em; margin: 0 0 40px; }
  .contact-big em { font-weight: 300; }
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; border-top: 1px solid var(--ink); padding-top: 36px; }
  .mail { font-family: var(--font-display); font-size: clamp(24px, 3vw, 40px); text-decoration: none; border-bottom: 2px solid var(--ink); }
  .mail:hover { font-style: italic; }
  .contact-info p { margin: 18px 0 0; }
  .socials { list-style: none; padding: 0; margin: 28px 0 0; }
  .socials a { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; transition: padding .25s; }
  .socials a:hover { padding-left: 10px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  form .full { grid-column: 1 / -1; }
  input, textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 0; border-bottom: 1px solid var(--ink); padding: 12px 0; border-radius: 0; }
  input:focus, textarea:focus { outline: none; border-bottom-width: 2px; }
  textarea { resize: vertical; min-height: 120px; }
  form button { justify-self: start; cursor: pointer; font: inherit; }
  .form-note { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin: 0; min-height: 1em; }
  @media (max-width: 800px) { .contact-grid, form { grid-template-columns: 1fr; } }

  footer { padding: 36px 0 110px; }
  footer .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; }
  footer svg { width: 64px; height: 48px; }
  @media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; } .hero .sample { max-width: 360px; } }
</style>
</head>
<body data-variant="1">
<div id="app"></div>
<script src="assets/content.js"></script>
<script src="assets/crows.js"></script>
<script src="assets/shared.js"></script>
<script>
(function () {
  var S = SITE, e = UI.esc;
  var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
  var first = S.name.split(' ')[0], last = S.name.split(' ')[1];
  var featured = S.featured;

  var ticker = S.titles.concat(['Revit 2019–2027', 'Autodesk Platform Services', 'Cairo → US & Europe']);
  var tickerHtml = ticker.concat(ticker).map(function (t) { return '<span>' + e(t) + '</span><i>✦</i>'; }).join('');

  var html = '' +
  '<header class="nav"><div class="wrap">' +
    '<a class="brand" href="#top">' + CROW.perchedSolid() + e(S.name) + '</a>' +
    '<ul><li><a href="#about">About</a></li><li><a href="#skills">Skills</a></li><li><a href="#work">Work</a></li><li><a href="#experience">Experience</a></li><li><a href="#contact">Contact</a></li></ul>' +
    '<a class="cv" href="' + e(S.resume) + '">Résumé ↓</a>' +
  '</div></header>' +

  '<section class="hero" id="top" data-sec><div class="wrap">' +
    '<div class="masthead"><span>The Corvid Review</span><span>' + e(S.role) + '</span><span>' + e(S.location) + '</span></div>' +
    '<div class="hero-grid">' +
      '<div><h1 class="rv">' + e(first) + '<br><em>' + e(last) + '</em><span class="dot"></span></h1>' +
      '<p class="role rv"><strong>' + e(S.role) + '</strong>, building <strong>' + e(S.tagline) + '</strong>. Mechanical engineer by training, software developer by obsession — clever, curious and a little bit crow.</p>' +
      '<div class="actions rv"><a class="btn btn-solid" href="#work">See selected work →</a><a class="btn" href="#contact">Get in touch</a></div></div>' +
      '<figure class="sample rv" style="margin:0"><img class="mono" src="' + e(S.portrait) + '" alt="Omar Amen">' +
        '<figcaption><b>SAMPLE PHOTO</b>Replace with: waist-up portrait, 4:5, plain light-grey wall, black clothing, looking slightly off-camera, soft window light from one side.</figcaption></figure>' +
    '</div></div>' +
    '<div class="hero-crow">' + CROW.perchedSolid() + '</div>' +
  '</section>' +

  '<div class="ticker" aria-hidden="true"><div class="ticker-track">' + tickerHtml + '</div></div>' +

  '<section id="about" data-sec><div class="wrap">' +
    '<div class="sec-head"><span class="sec-no">01</span><h2 class="sec-title">About</h2><span class="sec-aside">Profile</span></div>' +
    '<div class="about-grid">' +
      '<p class="lede rv">' + e(S.profile) + '</p>' +
      '<figure class="about-photo rv" style="margin:0"><img class="mono" src="' + e(S.portrait) + '" alt="Omar Amen"></figure>' +
      '<div class="stats rv">' + S.stats.map(function (s) { return '<div class="stat"><b>' + e(s.value) + '</b><span>' + e(s.label) + '</span></div>'; }).join('') + '</div>' +
    '</div>' +
  '</div></section>' +

  '<section id="skills" data-sec><div class="wrap">' +
    '<div class="sec-head"><span class="sec-no">02</span><h2 class="sec-title">Skills</h2><span class="sec-aside">Core toolkit</span></div>' +
    '<div class="skills">' + S.skillGroups.map(function (g, i) {
      return '<div class="skill rv"><h3>' + e(g.name) + '<small>' + pad2(i + 1) + '</small></h3><ul>' + g.items.map(function (x) { return '<li>' + e(x) + '</li>'; }).join('') + '</ul></div>';
    }).join('') + '</div>' +
    '<div class="levels rv">' + S.levels.map(function (l) {
      return '<div class="level"><b>' + l.value + '%</b><span>' + e(l.name) + '</span><i style="--v:' + l.value + '%"></i></div>';
    }).join('') + '</div>' +
  '</div></section>' +

  '<section id="work" data-sec><div class="wrap">' +
    '<div class="sec-head"><span class="sec-no">03</span><h2 class="sec-title">Selected work</h2><span class="sec-aside">' + S.projects.length + ' projects · click to open</span></div>' +
    '<ol class="work">' + S.projects.map(function (p, i) {
      return '<li class="rv"><a href="#" data-project="' + e(p.id) + '" data-img="' + e(p.images[0]) + '">' +
        '<span class="no">' + pad2(i + 1) + '</span>' +
        '<span class="nm">' + e(p.name) + (featured.indexOf(p.id) > -1 ? '<span class="star">FEATURED</span>' : '') + '</span>' +
        '<span class="ds">' + e(p.short) + '</span>' +
        '<span class="tl">' + e(p.tools.slice(0, 3).join(' · ')) + '</span>' +
        '<img class="thumb mono" src="' + e(p.images[0]) + '" alt="" loading="lazy">' +
      '</a></li>';
    }).join('') + '</ol>' +
  '</div></section>' +

  '<section id="experience" data-sec><div class="wrap">' +
    '<div class="sec-head"><span class="sec-no">04</span><h2 class="sec-title">Experience</h2><span class="sec-aside">2019 — today</span></div>' +
    '<div class="xp">' + S.experience.map(function (x) {
      return '<div class="xp-row rv"><div class="xp-when">' + e(x.when) + '</div>' +
        '<div><h3 class="xp-role">' + e(x.role) + '</h3><p class="xp-org">' + e(x.org) + '</p><p class="xp-where">' + e(x.where) + '</p></div>' +
        '<ul>' + x.points.map(function (p) { return '<li>' + e(p) + '</li>'; }).join('') + '</ul></div>';
    }).join('') + '</div>' +
  '</div></section>' +

  '<section id="education" data-sec><div class="wrap">' +
    '<div class="sec-head"><span class="sec-no">05</span><h2 class="sec-title">Education &amp; training</h2><span class="sec-aside">Awards included</span></div>' +
    '<div class="edu">' + S.education.map(function (x) {
      return '<div class="rv"><span class="when">' + e(x.when) + '</span><h3>' + e(x.title) + '</h3><p>' + e(x.org) + '</p>' + (x.note ? '<span class="award">' + e(x.note) + '</span>' : '') + '</div>';
    }).join('') + '</div>' +
  '</div></section>' +

  '<section id="contact" data-sec><div class="wrap">' +
    '<div class="sec-head"><span class="sec-no">06</span><span class="sec-aside" style="grid-column:2">Contact</span></div>' +
    '<h2 class="contact-big rv">Let’s build<br><em>something clever.</em></h2>' +
    '<div class="contact-grid">' +
      '<div class="contact-info rv"><a class="mail" href="mailto:' + e(S.email) + '">' + e(S.email) + '</a>' +
        '<p>' + e(S.phone) + ' · <a href="' + e(S.phoneHref) + '">call</a><br>' + e(S.location) + '</p>' +
        '<ul class="socials">' + S.social.map(function (s) { return '<li><a href="' + e(s.url) + '" target="_blank" rel="noopener"><span>' + e(s.name) + '</span><span>↗</span></a></li>'; }).join('') + '</ul></div>' +
      '<form class="rv" data-demo>' +
        '<input placeholder="Your name" required><input type="email" placeholder="Your email" required>' +
        '<input class="full" placeholder="Subject" required><textarea class="full" placeholder="Message" required></textarea>' +
        '<button class="btn btn-solid" type="submit">Send message →</button><p class="form-note"></p></form>' +
    '</div>' +
  '</div></section>' +

  '<footer><div class="wrap">' + CROW.perchedSolid() + '<span>© ' + new Date().getFullYear() + ' ' + e(S.name) + ' · ' + e(S.site) + '</span><a href="#top">Back to top ↑</a></div></footer>';

  document.getElementById('app').innerHTML = html;

  // project index: floating cover preview that follows the cursor
  var peek = document.createElement('img');
  peek.className = 'peek'; peek.alt = '';
  document.body.appendChild(peek);
  document.querySelectorAll('.work a').forEach(function (a) {
    a.addEventListener('mouseenter', function () { peek.src = a.dataset.img; peek.classList.add('on'); });
    a.addEventListener('mouseleave', function () { peek.classList.remove('on'); });
    a.addEventListener('mousemove', function (ev) { peek.style.left = (ev.clientX + 200) + 'px'; peek.style.top = ev.clientY + 'px'; });
  });

  UI.init();
})();
</script>
</body>
</html>
